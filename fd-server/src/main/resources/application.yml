spring:
  application:
    name: fd-server
  datasource:
    url: jdbc:h2:file:/var/lib/h2/db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:fdredis123}
      timeout: 3000ms
  rabbitmq:
    host: 47.110.152.25
    port: 5672
    username: admin
    password: rabbitmq@hnlx
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: 9988

# Actuator 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers,logfile,env,metrics
  endpoint:
    logfile:
      external-file: logs/fd-server.log
    health:
      show-details: when-authorized

# Freshdesk 配置
freshdesk:
  domain: simsonn.freshdesk.com
  api-key: slHVv3wH9gTk8dEUPPW
  webhook:
    secret: ${FRESHDESK_WEBHOOK_SECRET:}
  sync:
    cron: "0 0/15 * * * ?"
    statuses: 2,3
  api:
    connect-timeout: 10000
    read-timeout: 30000
