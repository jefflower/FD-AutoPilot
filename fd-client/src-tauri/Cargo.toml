[package]
name = "fd-client"
version = "0.0.0"
description = "FD-AutoPilot Client - Tauri desktop app + standalone bridge server"
authors = ["you"]
edition = "2021"
default-run = "fd-client"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP 服务器（Agent Runtime Bridge）
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
# Shadow Agent 依赖（SSE 流式输出）
tokio-stream = "0.1"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
# Tauri 桌面客户端（可选，仅桌面模式需要）
tauri = { version = "2", features = ["devtools"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[features]
default = ["tauri-app"]
tauri-app = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-dialog", "dep:tauri-build"]

# Tauri 桌面应用二进制
[[bin]]
name = "fd-client"
path = "src/main.rs"
required-features = ["tauri-app"]

# 独立 Bridge 服务器（无需 Tauri GUI）
[[bin]]
name = "fd-bridge"
path = "src/bin/bridge.rs"
